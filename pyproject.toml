[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sre-bench"
version = "0.1.0"
description = "A benchmark for AI SRE agents: 121 Kubernetes/OpenShift operations tasks, a deterministic four-dimension rubric with hard safety blockers, and an optional LLM judge."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PulseSRE" }]
keywords = ["sre", "benchmark", "ai-agents", "kubernetes", "evals"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
judge = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sre-bench = "sre_bench.cli:main"

[project.urls]
Homepage = "https://github.com/PulseSRE/sre-bench"

[tool.setuptools.packages.find]
include = ["sre_bench*"]

[tool.setuptools.package-data]
"sre_bench.suites" = ["*.json"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
